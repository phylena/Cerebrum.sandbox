name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[test]'
      - name: Build the sandbox base image (enables the live isolation tests)
        run: docker build -t cerebrum-sandbox/base:latest -f images/base.Dockerfile images
      - name: Unit + live Docker tests
        run: python -m pytest -q
      - name: Validate the AWS template
        run: pip install cfn-lint && cfn-lint deploy/aws/cerebrum-sandbox.yaml
