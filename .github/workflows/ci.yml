name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[test]'
      - name: Install gVisor (pinned release, checksum verified) so the gVisor tests run too
        run: |
          B=https://storage.googleapis.com/gvisor/releases/release/20261123/x86_64
          curl -fsSLO $B/gvisor.tar.bz2 && curl -fsSLO $B/gvisor.tar.bz2.sha512 && sha512sum -c gvisor.tar.bz2.sha512
          tar -xjf gvisor.tar.bz2 runsc && sudo install -m 0755 runsc /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install && sudo systemctl restart docker
      - name: Build the sandbox base image (enables the live isolation tests)
        run: docker build -t cerebrum-sandbox/base:latest -f images/base.Dockerfile images
      - name: Unit + live Docker tests
        run: python -m pytest -q
      - name: Validate the AWS template
        run: pip install cfn-lint && cfn-lint deploy/aws/cerebrum-sandbox.yaml
