[project]
name = "cerebrum-sandbox"
version = "0.1.0"
description = "Self-hosted isolated execution infrastructure for Cerebrum"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27", "cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a live Docker daemon (skipped otherwise)"]

[tool.setuptools]
packages = ["cerebrum_sandbox", "cerebrum_sandbox.runtime", "cerebrum_sandbox.api"]

[tool.setuptools.package-data]
cerebrum_sandbox = ["dashboard/*"]
