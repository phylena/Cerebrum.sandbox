<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerebrum.sandbox</title>
<link rel="stylesheet" href="/dashboard/app.css">
</head>
<body>
<header>
  <div class="brand">Cerebrum<span>.sandbox</span></div>
  <nav id="tabs"></nav>
  <div id="who" class="who"></div>
</header>
<main>
  <section id="login" class="card narrow">
    <h2>Sign in</h2>
    <p class="muted">Paste an API key. It stays in this browser tab only (sessionStorage) and is sent as a bearer token.</p>
    <form id="login-form"><input id="key" type="password" autocomplete="off" placeholder="API key" required>
      <button type="submit">Connect</button></form>
    <p id="login-error" class="error"></p>
  </section>
  <div id="views" hidden></div>
</main>
<div id="toast" role="status"></div>
<script src="/dashboard/app.js"></script>
</body>
</html>
